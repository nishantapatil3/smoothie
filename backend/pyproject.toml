[project]
name = "smoothie"
version = "0.0.3"
description = "Local-first audio transcription and summarization server (whisper.cpp + pluggable LLM summaries)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywhispercpp==1.5.1",
    "numpy>=1.24",
    "huggingface-hub>=0.20",
    "truststore>=0.10",
    "silero-vad>=6.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smoothie*"]

[tool.setuptools.package-data]
smoothie = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
